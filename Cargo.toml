[workspace]
members = [
    "crates/vmon-core",
    "crates/vmon-tui",
    "crates/vmon-report",
    "crates/vmon-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "Apache-2.0"

[workspace.dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
futures = "0.3"
humantime = "2"
libc = "0.2"
minijinja = "2"
nvml-wrapper = "0.10"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rmpv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
vmon-core = { path = "crates/vmon-core", version = "0.1.0" }
vmon-report = { path = "crates/vmon-report", version = "0.1.0" }
vmon-tui = { path = "crates/vmon-tui", version = "0.1.0" }
zmq = "0.10"

[profile.release]
strip = true
lto = true

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
